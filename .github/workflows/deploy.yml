name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate config.js from secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        run: |
          python3 - <<'EOF'
          import json, os
          key = os.environ.get("GEMINI_API_KEY", "").strip()
          if not key:
              raise SystemExit("ERROR: falta configurar el secreto GEMINI_API_KEY en Settings > Secrets and variables > Actions")
          model = os.environ.get("GEMINI_MODEL", "").strip() or "gemini-3.5-flash-lite"
          cfg = {
              "geminiApiKey": key,
              "geminiModel": model,
          }
          with open("js/config.js", "w", encoding="utf-8") as f:
              f.write("window.APP_CONFIG = " + json.dumps(cfg) + ";\n")
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
